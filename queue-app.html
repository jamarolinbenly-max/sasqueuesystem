<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Simple queue management system with QR code scanning">
  <title>Queue System</title>
  <link rel="manifest" href="data:application/json,{
    \"name\": \"Queue System\",
    \"short_name\": \"Queue\",
    \"start_url\": \".\",
    \"display\": \"standalone\",
    \"background_color\": \"#ffffff\",
    \"theme_color\": \"#378ADD\",
    \"icons\": [
      {
        \"src\": \"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%23378ADD' width='192' height='192'/%3E%3Ctext x='50%' y='50%' font-size='80' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'%3EQ%3C/text%3E%3C/svg%3E\",
        \"sizes\": \"192x192\",
        \"type\": \"image/svg+xml\",
        \"purpose\": \"any\"
      }
    ]
  }">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23378ADD' width='100' height='100'/%3E%3Ctext x='50' y='55' font-size='60' font-weight='bold' fill='white' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #1a3a52;
      --blue-dark: #0f2438;
      --gold: #D4AF37;
      --gray-light: #F5F5F5;
      --gray-bg: #FAFAF8;
      --gray-border: #D3D1C7;
      --gray-text: #2C2C2C;
      --gray-text-light: #666666;
      --red: #D32F2F;
      --white: #FFFFFF;
      --radius: 8px;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--gray-bg);
      color: var(--gray-text);
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--white);
    }

    .header {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: var(--white);
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      margin: 0;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1rem;
      gap: 1rem;
    }

    .main-row {
      display: flex;
      flex-direction: row;
      gap: 1rem;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: var(--gray-bg);
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      font-size: 16px;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26, 58, 82, 0.1);
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: var(--white);
      border: 2px solid var(--gold);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--gold) 0%, #C9A227 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(26, 58, 82, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--gray-border);
      color: var(--gray-text);
    }

    .btn-secondary:hover {
      background: var(--gray-light);
      border-color: var(--gray-text-light);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
    }

    .btn-danger:hover {
      background: rgba(211, 47, 47, 0.1);
    }

    .announce-section {
      text-align: center;
    }

    .announce-display {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: var(--white);
      border-radius: 12px;
      padding: 2rem 1rem;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(26, 58, 82, 0.3);
      border-top: 4px solid var(--gold);
    }

    .announce-label {
      font-size: 12px;
      opacity: 0.9;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .announce-name {
      font-size: 48px;
      font-weight: 700;
      word-break: break-word;
    }

    .queue-count {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-text-light);
      margin: 0.5rem 0;
    }

    .queue-list {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      background: var(--white);
    }

    .queue-empty {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--gray-text-light);
      font-size: 16px;
    }

    .queue-item {
      padding: 1.25rem 1.25rem;
      border-bottom: 1px solid var(--gray-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .queue-item:hover {
      background: var(--gray-light);
    }

    .queue-item:last-child {
      border-bottom: none;
    }

    .queue-item-info {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex: 1;
      min-width: 0;
    }

    .queue-item-number {
      background: var(--blue);
      color: var(--white);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    .queue-item-name {
      font-weight: 600;
      font-size: 18px;
      color: var(--gray-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .button-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .button-group button {
      flex: 1;
    }

    .full-width {
      width: 100%;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 24px;
      }

      .content {
        padding: 0.75rem;
        gap: 0.75rem;
      }

      .card {
        padding: 0.75rem;
      }

      .main-row {
        flex-direction: column;
      }

      .announce-display {
        min-height: 120px;
        padding: 1.5rem 1rem;
      }

      .announce-name {
        font-size: 36px;
      }

      button {
        padding: 0.65rem 1rem;
        font-size: 13px;
      }
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>SAS Queuing System</h1>
    </div>

    <div class="content">
      <div class="card" style="padding: 0.75rem;">
        <div class="input-group">
          <input 
            type="text" 
            id="nameInput" 
            placeholder="Enter name or scan QR code"
            autocomplete="off"
          >
          <select id="windowSelect" style="padding: 0.75rem; border: 1px solid var(--gray-border); border-radius: var(--radius); font-size: 14px; font-family: inherit;">
            <option value="Window 1">Window 1</option>
            <option value="Window 2">Window 2</option>
            <option value="Window 3">Window 3</option>
          </select>
          <button class="btn-primary" onclick="addToQueue()">Add</button>
        </div>
        <div class="queue-count" id="queueCount">0 people waiting</div>
      </div>

      <div class="main-row">
        <div class="card announce-section" style="padding: 1rem; flex: 1; display: flex; flex-direction: column; min-height: 0;">
          <div style="font-size: 12px; color: var(--gray-text-light); margin-bottom: 0.5rem;">Now calling</div>
          <div class="announce-display" style="flex: 1; min-height: 0;">
            <div class="announce-label">Next</div>
            <div class="announce-name" id="announcedName" style="font-size: 40px;">—</div>
            <div class="announce-label" id="announcedWindow" style="margin-top: 0.5rem; font-size: 16px; letter-spacing: normal; text-transform: none; opacity: 1;"></div>
          </div>
        </div>

        <div class="card" style="flex: 1.4; display: flex; flex-direction: column; min-height: 0; padding: 0.75rem;">
          <div style="font-size: 16px; font-weight: 700; color: var(--gray-text); margin-bottom: 0.5rem;">Queue</div>
          <div class="queue-list scrollbar-hide" id="queueList">
            <div class="queue-empty">No one in queue yet</div>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-primary" style="flex: 1;" onclick="announceNext()">Call Next</button>
        <button class="btn-secondary" style="flex: 0 0 auto;" onclick="resetAnnounced()">Reset</button>
        <button class="btn-danger" style="flex: 0 0 auto;" onclick="clearQueue()">Clear</button>
      </div>

      <div style="margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: var(--gray-light); border-radius: var(--radius); border: 1px solid var(--gray-border);">
        <label style="font-size: 11px; font-weight: 600; color: var(--gray-text); display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" id="enableVoice" checked>
          Read name aloud in Tagalog when calling next
        </label>
        <label style="font-size: 11px; font-weight: 600; color: var(--gray-text); display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin-top: 0.3rem;">
          <input type="checkbox" id="enableSound" checked>
          Play bell sound when calling next
        </label>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAoT9t1c9vmXdXuURBaxTUVaKG_vhl7xmA",
      authDomain: "sasqueueingsystem.firebaseapp.com",
      databaseURL: "https://sasqueueingsystem-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sasqueueingsystem",
      storageBucket: "sasqueueingsystem.firebasestorage.app",
      messagingSenderId: "889117047176",
      appId: "1:889117047176:web:273f04ba1f24f295f2e23d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const queueRef = db.ref('queue');
    const announcedRef = db.ref('announced');

    // Keeps the latest snapshot of the queue in chronological order
    let currentQueue = []; // [{ key, name, window }]

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatName(name) {
      return name.replace(/\S+/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
    }

    function renderQueueList() {
      const list = document.getElementById('queueList');
      const count = document.getElementById('queueCount');

      count.textContent = currentQueue.length + ' ' + (currentQueue.length === 1 ? 'person' : 'people') + ' waiting';

      if (currentQueue.length === 0) {
        list.innerHTML = '<div class="queue-empty">No one in queue yet</div>';
        return;
      }

      list.innerHTML = currentQueue.map((entry, idx) => `
        <div class="queue-item">
          <div class="queue-item-info">
            <div class="queue-item-number">${idx + 1}</div>
            <div class="queue-item-name">${escapeHtml(formatName(entry.name))}${entry.window ? ' <span style="color: var(--gray-text-light); font-weight: 400;">&middot; ' + escapeHtml(entry.window) + '</span>' : ''}</div>
          </div>
          <button class="btn-danger" style="padding: 0.5rem 0.75rem; font-size: 12px;" onclick="removeFromQueue('${entry.key}')">Remove</button>
        </div>
      `).join('');
    }

    function renderAnnounced(entry) {
      const announced = document.getElementById('announcedName');
      const announcedWindow = document.getElementById('announcedWindow');

      if (entry) {
        announced.textContent = formatName(entry.name);
        announcedWindow.textContent = entry.window ? ('Please proceed to ' + entry.window) : '';
      } else {
        announced.textContent = '—';
        announcedWindow.textContent = '';
      }
    }

    // Live sync: fires immediately on load and every time the data changes,
    // from any device.
    queueRef.orderByChild('timestamp').on('value', (snapshot) => {
      const entries = [];
      snapshot.forEach((child) => {
        const val = child.val();
        entries.push({ key: child.key, name: val.name, window: val.window });
      });
      currentQueue = entries;
      renderQueueList();
    });

    let lastAnnounced = null;
    announcedRef.on('value', (snapshot) => {
      lastAnnounced = snapshot.val();
      renderAnnounced(lastAnnounced);
    });

    function addToQueue() {
      const input = document.getElementById('nameInput');
      const name = input.value.trim();
      const windowChoice = document.getElementById('windowSelect').value;

      if (!name) {
        input.focus();
        return;
      }

      queueRef.push({
        name: name,
        window: windowChoice,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      }).catch((err) => {
        alert('Could not add to queue. Check your connection.');
        console.error(err);
      });

      input.value = '';
      input.focus();
    }

    function removeFromQueue(key) {
      queueRef.child(key).remove();
    }

    function playBellSound() {
      // Create a simple bell sound using Web Audio API
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioContext.currentTime;
      
      // Bell sound frequencies
      const frequencies = [800, 600, 400];
      
      frequencies.forEach((freq, index) => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, now + index * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, now + index * 0.1 + 0.3);
        
        osc.start(now + index * 0.1);
        osc.stop(now + index * 0.1 + 0.3);
      });
    }

    function speakName(name, windowChoice) {
      // Check if browser supports Web Speech API
      const SpeechSynthesisUtterance = window.SpeechSynthesisUtterance || window.webkitSpeechSynthesisUtterance;
      
      if (!SpeechSynthesisUtterance) {
        console.log('Text-to-speech not supported');
        return;
      }

      // Cancel any ongoing speech
      speechSynthesis.cancel();

      const text = windowChoice ? (name + ', ' + windowChoice) : name;

      // First announcement
      const utterance1 = new SpeechSynthesisUtterance();
      utterance1.text = text;
      utterance1.lang = 'tl-PH'; // Tagalog/Filipino language
      utterance1.rate = 0.75; // Slower for clearer pronunciation
      utterance1.pitch = 1;
      utterance1.volume = 1;
      
      // Speak first time
      speechSynthesis.speak(utterance1);
      
      // Second announcement after 3 seconds
      setTimeout(() => {
        const utterance2 = new SpeechSynthesisUtterance();
        utterance2.text = text;
        utterance2.lang = 'tl-PH';
        utterance2.rate = 0.75; // Slower for clearer pronunciation
        utterance2.pitch = 1;
        utterance2.volume = 1;
        
        speechSynthesis.speak(utterance2);
      }, 3000); // 3 second delay
    }

    function announceNext() {
      if (currentQueue.length === 0) return;

      const next = currentQueue[0]; // earliest by timestamp
      const announcedEntry = { name: next.name, window: next.window };

      announcedRef.set(announcedEntry).then(() => {
        return queueRef.child(next.key).remove();
      }).then(() => {
        // Play sound effect
        if (document.getElementById('enableSound').checked) {
          playBellSound();
        }

        // Announce name and window
        if (document.getElementById('enableVoice').checked) {
          setTimeout(() => {
            speakName(announcedEntry.name, announcedEntry.window);
          }, 500);
        }
      }).catch((err) => {
        alert('Could not call next in queue. Check your connection.');
        console.error(err);
      });
    }

    function resetAnnounced() {
      announcedRef.remove();
    }

    function clearQueue() {
      if (confirm('Clear all entries in the queue?')) {
        queueRef.remove();
        announcedRef.remove();
      }
    }

    document.getElementById('nameInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addToQueue();
    });

    // Auto-add name from URL parameter (for QR codes)
    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name');
      const windowChoice = params.get('window');
      if (name) {
        queueRef.push({
          name: decodeURIComponent(name),
          window: windowChoice ? decodeURIComponent(windowChoice) : 'Window 1',
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        // Clean up URL
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    checkUrlParams();
  </script>
</body>
</html>
